<!doctype html><meta charset="utf-8"><title>camera check</title><body><pre id="out">running</pre>
<script type="module">
import * as C from './cam.js';
import * as N from './dist/native.js';
const W = 1080, H = 1920, FPS = 40, Z0 = 5.4;
function replay(track, trace) {
  return new Promise((resolve, reject) => {const w = new Worker('/generated/motion-gallery-renderer/worker.js', {type: 'module'});
    w.onmessage = ({data}) => {w.terminate(); data.error ? reject(new Error(data.error)) : resolve(data);}; w.postMessage({request: 1, track, trace});});
}
const centreOf = f => {let x = 0, y = 0; for (let i = 0; i < f.length; i += 2) {x += f[i]; y += f[i + 1];} return {x: 2 * x / f.length, y: 2 * y / f.length};};
window.run = async (songs, configs) => {
  const rows = [];
  for (const song of songs) {
    const data = await (await fetch(`./data/${song}.json`)).json(), native = await replay(data.track, data.trace);
    const centres = data.trace.frames.map(centreOf);
    const R = C.rideSignals(centres, native.contacts, data.hits, data.phases, data.duration);
    for (const cfg of configs) {
      let cam;
      if (cfg.kind === 'today') {const fol = N.follower(data.trace.frames); cam = centres.map((_, f) => {const c = fol({w: W, h: H, z: Z0}, f); return {z: Z0, ax: W / 2, ay: 0.35 * H, x: c.x, y: c.y};});}
      else if (cfg.kind === 'v1') {
        // round-1 look-ahead camera, as it was
        const ZR = Z0 * 1.35, vel = centres.map((_, f) => {const a = centres[Math.max(0, f - 6)], b = centres[Math.min(centres.length - 1, f + 6)], n = Math.min(centres.length - 1, f + 6) - Math.max(0, f - 6) || 1; return {x: (b.x - a.x) / n, y: (b.y - a.y) / n};});
        const g = (arr, s) => arr.map((_, f) => {let x = 0, y = 0, w = 0; for (let k = -2 * s; k <= 2 * s; k++) {const e = Math.exp(-k * k / (2 * s * s)), v = arr[Math.max(0, Math.min(arr.length - 1, f + k))]; x += v.x * e; y += v.y * e; w += e;} return {x: x / w, y: y / w};});
        cam = C.roundOneCamera(centres);
      } else if (cfg.place) cam = C.buildPlaced(R, cfg);
      else cam = C.buildCamera(R, cfg);
      const m = C.measureCamera(R, cam), fr = C.measureFrame(R, cam); m.fr = fr;
      rows.push({song, cfg: cfg.name, ...m, list: m.list.sort((a, b) => b.px - a.px).slice(0, 4).map(e => `${e.axis}@${e.t0.toFixed(1)}:${e.px}px`).join(' ')});
    }
  }
  return rows;
};
window.ready = true;
</script>
