<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Judge themes</title>
<style>
:root{--bg:#f2f2f0;--card:#fff;--ink:#1a1c1f;--soft:#6b7078;--line:#d9dade;--on:#1a1c1f;--onInk:#fff;--ok:#2e8a55;--warn:#b5532a;
  --love:#c2410c;--keep:#2e8a55;--unsure:#8a7a2e;--cut:#6b7078}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--card:#1c1d20;--ink:#ebecee;--soft:#9ba1a9;--line:#303237;--on:#ebecee;--onInk:#121315;--ok:#6cc08f;--warn:#e58a5f;
  --love:#f08a4b;--keep:#6cc08f;--unsure:#cdbb63;--cut:#9ba1a9}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:var(--card);border-radius:10px}
button:active{transform:scale(.97)}
a{color:inherit}
img{display:block}
kbd{font:600 10px ui-monospace,monospace;color:var(--soft);margin-left:6px}
@media (pointer:coarse){kbd{display:none}}

.top{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:44px}
.top a.title{font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg{display:flex;background:var(--line);padding:2px;border-radius:9px;flex:none}
.seg a{padding:5px 14px;border-radius:7px;font-weight:600;font-size:14px;text-decoration:none}
.seg a.on{background:var(--card);box-shadow:0 1px 2px #0002}
.status{margin-left:auto;font-size:12px;color:var(--soft);white-space:nowrap}
.status .bad{color:var(--warn);font-weight:600}
@media (max-width:560px){.top a.title{display:none}.top{gap:8px}.seg a{padding:5px 10px}}

main{flex:1;min-height:0;display:flex;position:relative}
.judge{flex:1;min-width:0;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto;gap:8px;padding:4px 12px max(10px,env(safe-area-inset-bottom))}
.stage{min-height:0;display:flex;align-items:center;justify-content:center;gap:var(--between)}
.theme{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:12px;padding:4px;border:2px solid transparent;transition:border-color .1s}
.theme.flash{border-color:var(--ok)}
.shots{display:grid;gap:6px}
figure{margin:0;cursor:zoom-in}
figure img{border-radius:6px;background:var(--line)}
figcaption{font-size:11px;color:var(--soft);text-align:center;height:14px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label{display:flex;align-items:center;gap:6px;max-width:100%;font-weight:600;font-size:14px;height:22px}
.label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.label span:first-child,.label i{flex:none}
.v{font-size:12px;font-weight:600;font-style:normal;padding:1px 6px;border-radius:6px;color:var(--onInk)}
.bar{display:grid;gap:6px;width:100%;max-width:720px;justify-self:center}
.bar .row{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:1fr}
.bar .main button{min-height:56px;font-weight:700;font-size:16px}
.bar .aux button{min-height:48px;font-weight:600;font-size:15px}
button.on{color:var(--onInk);border-color:transparent}
.v-love{background:var(--love)!important}.v-keep{background:var(--keep)!important}.v-unsure{background:var(--unsure)!important}.v-cut{background:var(--cut)!important}
/* a phone on its side: the decisions on rails under the thumbs */
.rail{display:none}
@media (orientation:landscape) and (max-height:560px){
  .top{min-height:34px;padding:2px 12px}
  .judge{grid-template-columns:76px 1fr 76px;grid-template-rows:1fr auto;padding:2px 8px max(6px,env(safe-area-inset-bottom))}
  .rail{display:flex;flex-direction:column;gap:6px;grid-row:1 / span 2}
  .rail button{flex:1;font-weight:700;font-size:15px;padding:0 4px}
  .rail.l{grid-column:1}.rail.r{grid-column:3}
  .judge .stage{grid-column:2;grid-row:1}
  .judge .bar{grid-column:2;grid-row:2;max-width:none}
  .judge .bar .main{display:none}
  .judge .bar .aux button{min-height:40px}
}
.end{margin:auto;text-align:center;display:grid;gap:10px;justify-items:center}
.end p{margin:0;color:var(--soft)}
.end button{padding:12px 20px;font-weight:600}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--barH,120px) + 18px);z-index:6;background:var(--on);color:var(--onInk);border-radius:12px;
  padding:6px 6px 6px 14px;display:flex;align-items:center;gap:6px;font-size:14px;max-width:calc(100% - 24px);box-shadow:0 4px 18px #0004}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{background:transparent;color:inherit;border-color:#fff4;padding:8px 10px;font-weight:600;flex:none}

.sheet{position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:min(600px,100%);max-height:100%;overflow:auto;border-radius:14px 14px 0 0;padding:12px 14px max(14px,env(safe-area-inset-bottom));display:grid;gap:8px}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:14px}}
.sheet .strip{display:flex;gap:6px;justify-content:center}
.sheet .strip img{height:110px;border-radius:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 10px;font-size:14px;border-radius:999px}
.chips button.on{background:var(--on);color:var(--onInk)}
.sheet textarea{width:100%;font:16px system-ui,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.sheet .old{font-size:13px;color:var(--soft);margin:0}
.sheet .go{display:flex;gap:8px}.sheet .go button{flex:1;min-height:46px;font-weight:600}
.sheet .go button.primary{background:var(--on);color:var(--onInk)}
.viewer{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#ddd}
.viewer .shots{display:flex;gap:8px}
.viewer .who{font-weight:600;font-size:15px}
.viewer .x{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;background:#222;color:#eee;border-color:#444;padding:8px 14px}

.page{flex:1;overflow:auto;padding:10px 12px 40px}
.page h2{font-size:17px;margin:4px 0 8px}
.page p{color:var(--soft);font-size:13px;margin:0 0 10px;max-width:760px}
.sets a{display:block;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 8px;text-decoration:none}
.sets b{display:block;font-size:16px}.sets span{color:var(--soft);font-size:13px}
table{border-collapse:collapse;background:var(--card);border:1px solid var(--line);width:100%;max-width:1100px}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:11px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .pair{display:flex;gap:3px}td .pair img{width:34px;border-radius:3px;cursor:zoom-in}
td .notes{color:var(--soft);font-size:12px;margin-top:2px}
tr.cutline td{border-bottom:2px solid var(--ink)}
tr.retired{opacity:.55}tr.retired-head td{padding-top:18px;font-weight:600;color:var(--soft)}
.meter{display:inline-block;width:60px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
</style>
</head>
<body>
<header class="top" id="top"><a class="title" href="/rate/" id="title">Judge themes</a><span class="status" id="status"></span></header>
<main id="main"></main>
<script type="module">
// Judging themes, at /rate/<set> (scripts/gallery/ratings_api.ts). One screen for both ways of judging:
//   Sort: one theme, a verdict (love, keep, unsure, cut) per tap. Compare: two themes, left, right, equal or pass.
// Every theme shows two stills (the verse; inside the drop, after the verse), sized to the screen: no scrolling, on a phone
// upright or on its side or a desktop. A judgment saves at once and moves on; a toast offers a note on it or its undo.
// A still opens the viewer (comparing, a tap there flips between the two themes). Results: /rate/<set>/results.
// Events go to the server in batches from an outbox (kept across reloads); every device pulls the others' on focus and every
// 10 s. The judging model (the fit, the next pair) is model.js, shared with report.mjs. (Events call a comparison a duel.)
import {fold, fit, choosePair, groundOf, VERDICTS} from '/generated/concept-lab/rate/model.js';

const $ = id => document.getElementById(id), main = $('main');
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) k.startsWith('on') ? e[k] = v : k === 'class' ? e.className = v : e.setAttribute(k, v);
  e.append(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); return e;
};
const key = (label, k) => [label, k ? el('kbd', {}, k) : null];
const VERB = {love: 'Loved', keep: 'Kept', unsure: 'Unsure about', cut: 'Cut'}, WORD = {love: 'Love', keep: 'Keep', unsure: 'Unsure', cut: 'Cut'};
const [, set, sub] = location.pathname.match(/^\/rate\/([a-z0-9-]+)?(?:\/(results))?$/) ?? [];
if (!set) await home(); else await app(set, sub === 'results');

async function home() {
  const {sets} = await fetch('/api/rate').then(r => r.json());
  main.append(el('div', {class: 'page sets'}, el('h2', {}, 'Sets of themes'), sets.map(s =>
    el('a', {href: `/rate/${s.set}`}, el('b', {}, s.title), el('span', {}, `${s.themes} themes · ${s.created} · ${s.set}`)))));
}

async function app(set, results) {
  const base = `/generated/concept-lab/rate/sets/${set}`;
  const S = await fetch(`${base}/set.json`).then(r => r.ok ? r.json() : Promise.reject(new Error('unknown set')));
  const themes = S.themes, byId = new Map(themes.map(t => [t.id, t])), M = S.moments.length;
  // retired themes (set.json retired) stay in the fit, so what was said about them still counts, but are never shown again
  const retired = new Set(S.retired ?? []), shown = themes.filter(t => !retired.has(t.id)), among = new Set(shown.map(t => t.id));
  const still = (id, i) => `${base}/stills/${id}-${i + 1}.jpg`;
  const preload = ids => ids.forEach(id => S.moments.forEach((_, i) => {new Image().src = still(id, i);}));
  document.title = S.title; $('title').textContent = S.title;

  // ── the record: the server's events, and an outbox of this device's not yet saved ──
  const OUT = `rate-outbox-${set}`, MINE = `rate-mine-${set}`, DRAFT = `rate-draft-${set}`;
  const load = k => {try {return JSON.parse(localStorage.getItem(k) ?? 'null');} catch {return null;}};
  const keep = (k, v) => {try {localStorage.setItem(k, JSON.stringify(v));} catch {}};
  let server = [], seq = 0, setHash = null, outbox = load(OUT) ?? [], mine = load(MINE) ?? [], failed = false, stale = false, sending = false;
  let record = fold([]);
  // a set built on earlier ones (set.json buildsOn) carries their judgments: the same themes have the same ids, so a comparison
  // made there counts here; they are read, never written. Everything in the order it was saved, then this device's outbox.
  const earlier = Object.fromEntries((S.buildsOn ?? []).map(s => [s, {events: [], seq: 0}]));
  const refold = () => {
    const saved = [...Object.values(earlier).flatMap(x => x.events), ...server].sort((a, b) => (a.savedAt ?? '').localeCompare(b.savedAt ?? ''));
    const have = new Set(saved.map(e => e.id)); record = fold([...saved, ...outbox.filter(e => !have.has(e.id))]); status();
  };
  async function pull() {
    try {
      let n = 0;
      for (const [s, x] of Object.entries(earlier)) {const r = await fetch(`/api/rate/${s}/events?after=${x.seq}`).then(r => r.json()); x.events.push(...r.events); x.seq = r.seq; n += r.events.length;}
      const r = await fetch(`/api/rate/${set}/events?after=${seq}`).then(r => r.json());
      if (setHash && r.setHash !== setHash) stale = true;
      setHash ??= r.setHash; server.push(...r.events); seq = r.seq; refold(); return n + r.events.length;
    } catch {return 0;}
  }
  async function push() {
    if (sending || !outbox.length || stale) return; sending = true;
    const batch = outbox.slice(0, 50);
    try {
      const r = await fetch(`/api/rate/${set}/events`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({setHash, events: batch})});
      if (r.status === 409) stale = true;
      else if (r.status === 400) {console.warn('refused', await r.text()); outbox = outbox.slice(batch.length);}
      else if (!r.ok) throw new Error(String(r.status));
      else {outbox = outbox.slice(batch.length); failed = false;}
      keep(OUT, outbox);
    } catch {failed = true;}
    sending = false; await pull(); if (outbox.length && !failed && !stale) push();
  }
  const device = () => ({kind: matchMedia('(pointer:coarse)').matches ? 'phone' : 'desktop', w: innerWidth, h: innerHeight,
    standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true});
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  function emit(e) {
    const ev = {id: newId(), at: new Date().toISOString(), device: device(), ...e};
    outbox.push(ev); keep(OUT, outbox);
    if (e.kind !== 'retract') {mine.push(ev.id); keep(MINE, mine.slice(-500));}
    refold(); push(); return ev;
  }
  function status() {
    const v = shown.filter(t => record.verdicts[t.id]).length, d = record.duels.filter(x => x.outcome !== 'pass').length;
    $('status').replaceChildren(`${v}/${shown.length} sorted · ${d} compared · `,
      stale ? el('span', {class: 'bad'}, 'set changed: reload') : outbox.length ? el('span', {class: failed ? 'bad' : ''}, failed ? `${outbox.length} waiting` : 'saving') : 'saved');
  }
  let repaint = null, teardown = () => {};
  setInterval(() => {if (document.visibilityState === 'visible') {push(); pull().then(n => {if (n) repaint?.();});}}, 10000);
  document.addEventListener('visibilitychange', () => {if (document.visibilityState === 'visible') {push(); pull().then(() => repaint?.());}});
  await pull(); push();

  // ── the mode switch and the results link (the address keeps the mode: #sort, #duel) ──
  const seg = el('nav', {class: 'seg'}, el('a', {href: `/rate/${set}#sort`, 'data-m': 'sort'}, 'Sort'), el('a', {href: `/rate/${set}#compare`, 'data-m': 'compare'}, 'Compare'),
    el('a', {href: `/rate/${set}/results`, 'data-m': 'results'}, 'Results'));
  $('top').insertBefore(seg, $('status'));

  // ── shared pieces ──
  /** The judging screen: a stage (one theme or two, each its moments) and the bar, or rails on a phone on its side. */
  function screen({rails = [null, null], bar}) {
    const stage = el('div', {class: 'stage'}), root = el('div', {class: 'judge'}, rails[0] && el('div', {class: 'rail l'}, rails[0]), stage, bar, rails[1] && el('div', {class: 'rail r'}, rails[1]));
    main.append(root);
    const ro = new ResizeObserver(() => {main.style.setProperty('--barH', `${bar.offsetHeight}px`); repaint?.();}); ro.observe(stage);
    return {stage, root, stop: () => ro.disconnect()};
  }
  /** The largest stills (9:16) for n themes of M moments in a w×h stage: every still in a row, or each theme's moments
   *  stacked in a column, whichever shows them bigger. */
  function layout(w, h, n) {
    const label = 24, cap = 15, gap = 6, between = n > 1 ? 18 : 0, pad = 12, options = [];
    const rowW = (w - between * (n - 1) - n * pad - gap * (n * M - n)) / (n * M);
    options.push({cols: M, size: Math.min(rowW, (h - label - cap - pad) * 9 / 16)});
    if (M > 1) {const colW = (w - between * (n - 1) - n * pad) / n; options.push({cols: 1, size: Math.min(colW, ((h - label - pad - M * cap - gap * (M - 1)) / M) * 9 / 16)});}
    const best = options.sort((a, b) => b.size - a.size)[0];
    return {cols: best.cols, w: Math.max(30, Math.floor(best.size)), h: Math.max(53, Math.floor(best.size * 16 / 9)), between};
  }
  // a theme without a drop look still changes a little inside the drop (Whisper paper follows the ride's intensity): say so
  // in a set of variations (pairs within one theme) the screen names the version, which is what differs: "Rothko · vibrance" is
  // "vibrance", the theme as it was is "today" (the full name stays in the results)
  const name = id => {const l = byId.get(id).label; return S.pairs === 'group' ? (l.split(' · ')[1] ?? 'today').replace('saturation and ', 'sat. + ') : l;};
  // the two moments by the ride's intensity (intensity.js): the verse is ordinary (about 0.36), the second moment intense (0.71)
  const caption = (t, m) => /drop/i.test(m.label) && t.spec.look.drop === 'off' ? 'Intense part' : S.pairs === 'group' && m.label === 'Verse' ? 'Normal part' : m.label;
  function themeView(id, size, {onlook, tag} = {}) {
    const t = byId.get(id), v = record.verdicts[id];
    // exactly as wide as its stills: a long name is cut short, never widens the stage
    return el('div', {class: 'theme', style: `width:${size.cols * size.w + (size.cols - 1) * 6 + 12}px`},
      el('div', {class: 'shots', style: `grid-template-columns:repeat(${size.cols},auto)`}, S.moments.map((m, i) =>
        el('figure', {onclick: e => {e.stopPropagation(); onlook(i);}}, el('img', {src: still(id, i), alt: `${t.label}, ${m.label}`, style: `width:${size.w}px;height:${size.h}px`}),
          el('figcaption', {style: `width:${size.w}px`}, caption(t, m))))),
      el('div', {class: 'label'}, tag ? el('span', {style: 'color:var(--soft);font-weight:500'}, tag) : null, el('span', {}, name(id)), v ? el('i', {class: `v v-${v}`}, WORD[v]) : null,
        record.notes.some(n => n.themes.includes(id)) ? el('span', {title: 'has notes', style: 'color:var(--soft)'}, '✎') : null));
  }
  let toastTimer = null;
  function toast(text, {onNote, onUndo}) {
    document.querySelector('.toast')?.remove(); clearTimeout(toastTimer);
    const box = el('div', {class: 'toast'}, el('span', {}, text),
      el('button', {onclick: () => {box.remove(); onNote();}}, '✎ Note'), el('button', {onclick: () => {box.remove(); onUndo();}}, '↶ Undo'));
    main.append(box); toastTimer = setTimeout(() => box.remove(), 5000);
  }
  /** The note sheet: about one theme, or in a duel about either or the pair. A draft survives a reload. */
  function note(targets) {
    if (document.querySelector('.sheet')) return;
    const choices = targets.length > 1 ? [...targets.map(id => [name(id), [id]]), ['The pair', targets]] : [[name(targets[0]), targets]];
    let at = choices.length - 1;  // a duel's note is about the pair unless a side is chosen
    const t = el('textarea', {rows: '4', placeholder: 'What works, what does not, what to try…'});
    t.value = load(DRAFT)?.text ?? '';
    t.oninput = () => keep(DRAFT, {text: t.value});
    const chips = el('div', {class: 'chips'}), old = el('div');
    const strip = el('div', {class: 'strip'}, targets.flatMap(id => S.moments.map((_, i) => el('img', {src: still(id, i), alt: ''}))));
    const paint = () => {
      chips.replaceChildren(...(choices.length > 1 ? choices.map(([label], i) => el('button', {class: i === at ? 'on' : '', onclick: () => {at = i; paint(); t.focus();}}, label)) : []));
      const ids = choices[at][1], earlier = record.notes.filter(n => n.themes.length === ids.length && ids.every(id => n.themes.includes(id)));
      old.replaceChildren(...earlier.map(n => el('p', {class: 'old'}, `“${n.text}”`)));
    };
    const close = save => {
      if (save && t.value.trim()) emit({kind: 'note', themes: choices[at][1], text: t.value.trim()});
      if (save || !t.value.trim()) keep(DRAFT, null);
      sheet.remove(); removeEventListener('keydown', keys, true); repaint?.();
    };
    const keys = e => {
      if (e.key === 'Escape') {e.preventDefault(); e.stopPropagation(); close(true);}
      else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {e.preventDefault(); close(true);}
    };
    const sheet = el('div', {class: 'sheet', onclick: e => {if (e.target === sheet) close(true);}},
      el('div', {class: 'box'}, strip, chips, old, t, el('div', {class: 'go'}, el('button', {onclick: () => close(false)}, 'Cancel'), el('button', {class: 'primary', onclick: () => close(true)}, 'Save note'))));
    paint(); document.body.append(sheet); addEventListener('keydown', keys, true); t.focus();
  }
  /** Full screen: a theme's moments at full height; in a duel a tap flips to the other theme. */
  function viewer(ids, start = 0) {
    let at = start;
    const shots = el('div', {class: 'shots'}), who = el('div', {class: 'who'});
    const paint = () => {
      const id = ids[at], w = Math.min((innerWidth - 24 - 8 * (M - 1)) / M, (innerHeight - 90) * 9 / 16);
      shots.replaceChildren(...S.moments.map((_, i) => el('img', {src: still(id, i), alt: '', style: `width:${w}px;height:${w * 16 / 9}px;border-radius:6px`})));
      who.textContent = ids.length > 1 ? `${at ? 'Right' : 'Left'}: ${name(id)} · tap to flip` : `${name(id)} · tap to close`;
    };
    const close = () => {box.remove(); removeEventListener('keydown', keys, true);};
    const flip = () => {if (ids.length > 1) {at = 1 - at; paint();} else close();};
    const keys = e => {if (e.key === 'Escape' || e.key === 'v') {e.preventDefault(); e.stopPropagation(); close();} else if (e.key === 'x' || e.key === ' ') {e.preventDefault(); e.stopPropagation(); flip();}};
    const box = el('div', {class: 'viewer', onclick: flip}, shots, who, el('button', {class: 'x', onclick: e => {e.stopPropagation(); close();}}, '✕ Close'));
    paint(); document.body.append(box); addEventListener('keydown', keys, true);
  }
  const busy = () => document.querySelector('.sheet,.viewer');
  /** Take back this device's latest judgment still standing; returns it. */
  function undoMine() {
    const standing = new Set(record.live.map(e => e.id));
    const id = [...mine].reverse().find(x => standing.has(x)); if (!id) return null;
    const ev = record.live.find(e => e.id === id); emit({kind: 'retract', target: id}); return ev;
  }

  if (results) return showResults();
  const mode = () => ['#compare', '#duel'].includes(location.hash) ? 'compare' : location.hash === '#sort' ? 'sort' : shown.every(t => record.verdicts[t.id]) ? 'compare' : 'sort';
  function show() {
    teardown(); main.replaceChildren(); repaint = null;
    for (const a of seg.children) a.classList.toggle('on', a.dataset.m === mode());
    teardown = (mode() === 'compare' ? compare : sort)() ?? (() => {});
  }
  addEventListener('hashchange', () => pull().then(show));  // a change of mode catches up with the other device too

  // ── Sort ──
  const h32 = s => {let h = 2166136261; for (const c of set + s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0;};
  const order = [...shown].sort((a, b) => h32(a.id) - h32(b.id)).map(t => t.id);
  let sortAt = -1;
  function sort() {
    const next = from => {for (let k = 1; k <= order.length; k++) {const j = (from + k) % order.length; if (!record.verdicts[order[j]]) return j;} return -1;};
    if (sortAt < 0) sortAt = next(-1) >= 0 ? next(-1) : -2;
    const verdictButtons = VERDICTS.map((v, i) => el('button', {onclick: () => give(v)}, key(WORD[v], String(i + 1))));
    const railVerdicts = VERDICTS.map(v => el('button', {onclick: () => give(v)}, WORD[v]));
    const aux = el('div', {class: 'row aux'}, el('button', {onclick: () => go(sortAt - 1)}, key('‹', '[')), el('button', {onclick: undo}, key('↶ Undo', 'z')),
      el('button', {onclick: () => sortAt >= 0 && note([order[sortAt]])}, key('✎ Note', 'n')), el('button', {onclick: () => go(sortAt + 1)}, key('›', ']')));
    const bar = el('div', {class: 'bar'}, el('div', {class: 'row main'}, verdictButtons), aux);
    const left = [el('button', {onclick: () => go(sortAt - 1)}, '‹'), el('button', {onclick: () => sortAt >= 0 && note([order[sortAt]])}, '✎'), el('button', {onclick: undo}, '↶'), el('button', {onclick: () => go(sortAt + 1)}, '›')];
    const {stage, stop} = screen({rails: [left, railVerdicts], bar});
    function paint() {
      if (sortAt === -2) {
        stage.replaceChildren(el('div', {class: 'end'}, el('p', {}, `All ${shown.length} sorted.`), el('button', {onclick: () => {location.hash = '#compare';}}, 'On to comparing'),
          el('button', {onclick: () => go(0)}, 'Look through them again')));
        return;
      }
      const id = order[sortAt], v = record.verdicts[id];
      [...verdictButtons, ...railVerdicts].forEach((b, i) => {const val = VERDICTS[i % 4]; b.className = v === val ? `on v-${val}` : '';});
      stage.replaceChildren(themeView(id, layout(stage.clientWidth, stage.clientHeight, 1), {onlook: () => viewer([id]), tag: `${sortAt + 1}/${order.length}`}));
    }
    repaint = paint;
    function go(i) {sortAt = ((i % order.length) + order.length) % order.length; paint(); preload([order[(sortAt + 1) % order.length]]);}
    function give(v) {
      if (sortAt < 0 || busy()) return;
      const id = order[sortAt]; emit({kind: 'verdict', theme: id, value: v});
      stage.querySelector('.theme')?.classList.add('flash');
      toast(`${VERB[v]} “${name(id)}”`, {onNote: () => note([id]), onUndo: undo});
      const n = next(sortAt);
      setTimeout(() => {if (n < 0) {sortAt = -2; paint();} else go(n);}, 160);
    }
    function undo() {
      const ev = undoMine(); if (!ev) return;
      document.querySelector('.toast')?.remove();
      if (ev.kind === 'duel') {location.hash = '#compare'; return;}
      go(order.indexOf(ev.kind === 'verdict' ? ev.theme : ev.themes[0]));
    }
    const keys = e => {
      if (busy() || e.metaKey || e.ctrlKey || e.altKey || ['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
      if (/^[1-4]$/.test(e.key)) give(VERDICTS[+e.key - 1]);
      else if (e.key === '[' || e.key === 'ArrowLeft') go(sortAt - 1); else if (e.key === ']' || e.key === 'ArrowRight') go(sortAt + 1);
      else if (e.key === 'z' || e.key === 'Backspace') undo(); else if (e.key === 'n' && sortAt >= 0) note([order[sortAt]]);
      else if (e.key === 'v' && sortAt >= 0) viewer([order[sortAt]]); else if (e.key === 'Tab') location.hash = '#compare'; else return;
      e.preventDefault();
    };
    addEventListener('keydown', keys); paint(); if (sortAt >= 0) preload([order[(sortAt + 1) % order.length]]);
    return () => {removeEventListener('keydown', keys); stop(); document.querySelector('.toast')?.remove();};
  }

  // ── Compare ──
  let pair = null, last = [];
  const group = id => byId.get(id)?.group ?? null;
  // in a set of themes (not of variations): half the pairs, once every theme is placed, within one ground (dark, mid-tone, light),
  // and one pair in thirty asked again, to measure how consistent the answers are (owner, 9 November: "maximize the likelihood
  // that the data will be useful"; the simulation found the tilt neither helps nor hurts the ranking, see rate/ in the notes)
  const ground = id => groundOf(byId.get(id).spec.colours.paper), variations = S.pairs === 'group';
  const nextPair = () => choosePair(themes, record, {last, group, retired, within: variations, twins: S.twins ?? null,
    ...(variations ? {} : {ground, sameGround: 0.5, repeat: 1 / 30})});
  function compare() {
    pair ??= nextPair();
    let shown = performance.now(), locked = false;
    const decide = o => () => choose(o);
    // three columns: Left | Equal over Pass | Right, with Undo and Note beside Pass
    const main1 = el('div', {class: 'row main'}, el('button', {onclick: decide('left')}, key('◀ Left', '←')), el('button', {onclick: decide('equal')}, key('= Equal', '↑')),
      el('button', {onclick: decide('right')}, key('Right ▶', '→')));
    const aux = el('div', {class: 'row aux'}, el('button', {onclick: undo}, key('↶ Undo', 'z')), el('button', {onclick: decide('pass')}, key('Pass', '↓')),
      el('button', {onclick: () => pair && note(pair.slice(0, 2))}, key('✎ Note', 'n')));
    const auxRail = el('div', {class: 'row aux'}, el('button', {onclick: undo}, '↶ Undo'), el('button', {onclick: decide('equal')}, '= Equal'),
      el('button', {onclick: decide('pass')}, 'Pass'), el('button', {onclick: () => pair && note(pair.slice(0, 2))}, '✎ Note'));
    const bar = el('div', {class: 'bar'}, main1, aux, auxRail);
    const rails = [[el('button', {onclick: decide('left')}, '◀ Left')], [el('button', {onclick: decide('right')}, 'Right ▶')]];
    const {stage, root, stop} = screen({rails, bar});
    const sideways = () => getComputedStyle(root).gridTemplateColumns.split(' ').length === 3;
    function paint() {
      aux.hidden = sideways(); auxRail.hidden = !sideways();
      if (!pair) {stage.replaceChildren(el('div', {class: 'end'}, el('p', {}, 'Fewer than two themes left to compare (the cut ones sit out).'))); return;}
      const size = layout(stage.clientWidth, stage.clientHeight, 2);
      stage.style.setProperty('--between', `${size.between}px`);
      stage.replaceChildren(...pair.slice(0, 2).map((id, side) => themeView(id, size, {onlook: () => viewer(pair.slice(0, 2), side), tag: side ? 'Right' : 'Left'})));
    }
    repaint = paint;
    function choose(outcome) {
      if (!pair || locked || busy()) return; locked = true;
      const [a, b, why] = pair, ms = Math.round(performance.now() - shown);
      emit({kind: 'duel', left: a, right: b, outcome, ms, why});
      const views = stage.querySelectorAll('.theme');
      if (outcome === 'left' || outcome === 'equal') views[0]?.classList.add('flash');
      if (outcome === 'right' || outcome === 'equal') views[1]?.classList.add('flash');
      const la = name(a), lb = name(b);
      const text = outcome === 'left' ? `“${la}” over “${lb}”` : outcome === 'right' ? `“${lb}” over “${la}”` : outcome === 'equal' ? `Equal: “${la}”, “${lb}”` : 'Passed';
      toast(text, {onNote: () => note([a, b]), onUndo: undo});
      last = [a, b]; const upcoming = nextPair(); if (upcoming) preload(upcoming.slice(0, 2));
      setTimeout(() => {pair = upcoming; shown = performance.now(); locked = false; paint();}, 160);
    }
    function undo() {
      const ev = undoMine(); if (!ev) return;
      document.querySelector('.toast')?.remove();
      if (ev.kind === 'verdict') {sortAt = order.indexOf(ev.theme); location.hash = '#sort'; return;}
      if (ev.kind === 'duel') {pair = [ev.left, ev.right, 'again']; shown = performance.now(); locked = false; paint();}
    }
    const keys = e => {
      if (busy() || e.metaKey || e.ctrlKey || e.altKey || ['TEXTAREA', 'INPUT'].includes(e.target.tagName)) return;
      const k = {ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'equal', '=': 'equal', ArrowDown: 'pass', ' ': 'pass'}[e.key];
      if (k) choose(k);
      else if (e.key === 'z' || e.key === 'Backspace') undo(); else if (e.key === 'n' && pair) note(pair.slice(0, 2));
      else if (e.key === 'v' && pair) viewer(pair.slice(0, 2)); else if (e.key === 'Tab') location.hash = '#sort'; else return;
      e.preventDefault();
    };
    addEventListener('keydown', keys); paint();
    return () => {removeEventListener('keydown', keys); stop(); document.querySelector('.toast')?.remove();};
  }

  show();

  // ── Results: one ranking from every verdict and duel ──
  function showResults() {
    for (const a of seg.children) a.classList.toggle('on', a.dataset.m === 'results');
    const paint = () => {
      const top = 32, f = fit(themes, record, {top, among, twins: S.twins ?? null}), page = el('div', {class: 'page'});
      const nDuels = record.duels.filter(d => d.outcome !== 'pass').length;
      // settled: its place relative to the best `top` is clear either way (in or out in at least 9 draws out of 10)
      const settled = f.order.filter(r => !r.retired && (r.pTop >= 0.9 || r.pTop <= 0.1)).length;
      const sorted = shown.filter(t => record.verdicts[t.id]).length;
      page.append(el('h2', {}, S.title),
        el('p', {}, `${sorted} of ${shown.length} sorted, ${nDuels} comparisons, ${record.notes.length} notes; ${settled} of ${shown.length} settled (clearly in or out of the best ${top}). ` +
          (retired.size ? `${retired.size} retired themes are listed last: no longer shown, but what was said about them still counts. ` : '') + `Strength: a Bradley–Terry fit of the comparisons with ties, each verdict an anchor; ` +
          `“Best ${top}”: how often a theme lands among the best ${top} when the uncertainty is drawn. The line marks the ${top}th.`),
        el('table', {}, el('thead', {}, el('tr', {}, ['#', 'Theme', '', 'Verdict', 'Strength', `Best ${top}`, 'Compared'].map((h, i) => el('th', {class: i >= 4 || i === 0 ? 'n' : ''}, h)))),
          el('tbody', {}, f.order.flatMap(r => {
            const t = byId.get(r.id), notes = record.notes.filter(n => n.themes.includes(r.id));
            const head = r.retired && r === f.order.find(x => x.retired) ? [el('tr', {class: 'retired-head'}, el('td', {colspan: 7}, 'Retired'))] : [];
            return [...head, el('tr', {class: r.rank === top ? 'cutline' : r.retired ? 'retired' : ''},
              el('td', {class: 'n'}, r.retired ? '–' : String(r.rank)),
              el('td', {}, el('div', {class: 'pair'}, S.moments.map((_, i) => el('img', {src: still(r.id, i), alt: '', loading: 'lazy', onclick: () => viewer([r.id])})))),
              el('td', {}, t.label, notes.length ? el('div', {class: 'notes'}, notes.map(n => el('div', {}, `${n.themes.length > 1 ? 'pair: ' : ''}“${n.text}”`))) : null),
              el('td', {}, r.verdict ? el('i', {class: `v v-${r.verdict}`}, WORD[r.verdict]) : '–'),
              el('td', {class: 'n'}, `${r.strength.toFixed(2)} ± ${r.se.toFixed(2)}`),
              el('td', {class: 'n'}, r.retired ? '–' : [`${Math.round(r.pTop * 100)}%`, el('span', {class: 'meter'}, el('i', {style: `width:${Math.round(r.pTop * 100)}%`}))]),
              el('td', {class: 'n'}, String(r.duels)))];
          }))));
      main.replaceChildren(page);
    };
    repaint = paint; paint();
  }
}
</script>
</body>
</html>
