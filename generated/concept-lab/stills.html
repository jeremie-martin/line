<!doctype html>
<meta charset="utf-8">
<title>Stills</title>
<script type="module">
// Stills of any look, drawn by the video renderer's own picture (scripts/video/picture.js), for rating pages. Proposed schemes
// and drop partners are added to the palettes in this page's memory only, so a candidate can be seen before it enters the code.
// Driven by stills.mjs.
import * as N from '/generated/renderer/native.js';
import {createPicture} from '/scripts/video/picture.js';
import {resolveLook} from '/scripts/video/look.js';
import {SCHEMES, DROP_SCHEMES} from '/scripts/video/palettes.js';

window.renderStills = async ({schemes = {}, drops = {}, jobs, width = 540, quality = 0.86}) => {
  for (const name of Object.keys(schemes)) if (Object.hasOwn(SCHEMES, name)) throw new Error(`scheme ${name} already exists`);
  Object.assign(SCHEMES, schemes); Object.assign(DROP_SCHEMES, drops);
  const sheet = await N.loadSheet(), canvas = document.createElement('canvas'), pictures = new Map(), out = {};
  canvas.width = width; canvas.height = width * 16 / 9;
  for (const {name, song, look, times} of jobs) {
    // one picture per song: a picture is a pure function of time and look
    if (!pictures.has(song)) {
      const scene = await (await fetch(`./data/${song}.json`)).json();
      pictures.set(song, createPicture(canvas, scene, await N.replay(scene.track, scene.trace), sheet, N.riderPainter()));
    }
    const picture = pictures.get(song), resolved = resolveLook(null, look);
    out[name] = times.map(t => {picture.draw(t, resolved); return canvas.toDataURL('image/jpeg', quality);});
  }
  return out;
};
/** The ride's intensity (0–1) every `step` seconds of song time, and the hits (song time, strength): to choose moments. */
window.levels = async ({song, step = 0.25}) => {
  const sheet = await N.loadSheet(), canvas = document.createElement('canvas'), scene = await (await fetch(`./data/${song}.json`)).json();
  const picture = createPicture(canvas, scene, await N.replay(scene.track, scene.trace), sheet, N.riderPainter()), [a, b] = picture.span ?? [0, 60];
  const out = []; for (let t = a; t <= b; t += step) out.push([+t.toFixed(2), +picture.levelAt(t).toFixed(3)]);
  return {span: [a, b], levels: out, hits: picture.hitTimes};
};
window.ready = true;
</script>
