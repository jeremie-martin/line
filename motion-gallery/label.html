<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impact labels · line</title><link rel="stylesheet" href="label.css"></head>
<body>
<header><strong>Impact labels</strong><span id="progress"></span></header>
<main>
  <p id="instructions"></p>
  <div class="stage"><canvas id="canvas"></canvas><div id="flash" aria-hidden="true"></div></div>
  <div class="controls">
    <button id="play">Play</button>
    <button id="slow" aria-pressed="false">Slow ×¼</button>
    <label class="beat"><input type="checkbox" id="beat-light" checked> beat light</label>
  </div>
  <form id="questions"></form>
  <textarea id="note" rows="2" placeholder="Optional note"></textarea>
  <div class="nav"><button id="back">Back</button><button id="skip">Skip</button><button id="next" class="primary">Save &amp; next</button></div>
  <p id="status" role="status"></p>
</main>
<audio id="audio" preload="auto"></audio>
<script type="module" src="label.js"></script>
</body></html>
