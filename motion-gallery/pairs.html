<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair study · line</title><link rel="stylesheet" href="label.css"><link rel="stylesheet" href="pairs.css"></head>
<body>
<header><strong>Pair study</strong><span id="progress"></span></header>
<main>
  <p id="prompt"></p>
  <p id="instructions"></p>
  <div class="pair">
    <figure>
      <div class="stage"><video id="left" muted playsinline preload="auto"></video><span class="led" aria-hidden="true"></span><span class="tag">A</span></div>
      <canvas class="timeline" id="left-timeline" aria-label="Beats in clip A; drag to scrub"></canvas>
    </figure>
    <figure>
      <div class="stage"><video id="right" muted playsinline preload="auto"></video><span class="led" aria-hidden="true"></span><span class="tag">B</span></div>
      <canvas class="timeline" id="right-timeline" aria-label="Beats in clip B; drag to scrub"></canvas>
    </figure>
  </div>
  <div class="controls">
    <button id="play">Pause</button>
    <button id="slow" aria-pressed="false">Half speed</button>
    <button id="sound" aria-pressed="false">Sound</button>
  </div>
  <div class="choices" id="choices"></div>
  <textarea id="note" rows="2" placeholder="Optional note about this pair"></textarea>
  <div class="nav"><button id="back">Back</button><button id="skip">Skip</button><button id="next" class="primary">Save &amp; next</button></div>
  <p id="status" role="status"></p>
</main>
<script type="module" src="pairs.js"></script>
</body></html>
