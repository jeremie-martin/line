<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video comparison</title><link rel="stylesheet" href="video-compare.css"></head>
<body><main><header><h1 id="title">Video comparison</h1><p id="intro">One player. Switch versions at the same moment.</p><nav id="related" aria-label="Related comparisons" hidden></nav></header><div class="layout"><section class="choices"><div id="study-controls" hidden><div id="comparison-groups"><div class="control-label">Compare</div><div id="groups" class="buttons" aria-label="Comparison groups"></div><p id="intent"></p></div><div class="control-label">Passage</div><div id="passages" class="buttons" aria-label="Music passages"></div><p id="passage-description" class="hint"></p><div class="control-label">Version</div></div><div id="versions" class="buttons" aria-label="Video versions"></div><p id="description"></p><details id="recipe" hidden><summary>Recipe</summary><pre id="recipe-text"></pre></details><p id="status" role="status" aria-live="polite">Loading…</p><p class="hint">Space: play / pause · ← →: previous / next version<br>Versions share the same moment. A different passage starts from the beginning.</p></section><section class="player"><div id="stage" class="stage"><canvas id="transition-frame" aria-hidden="true" hidden></canvas></div><div class="transport"><button id="play" disabled>Play</button><input id="seek" aria-label="Playback position" type="range" min="0" max="1" step="0.01" value="0" disabled><output id="time">0:00</output></div><div class="buttons"><button id="sound" aria-pressed="true">Sound on</button><button id="fullscreen">Fullscreen</button></div></section></div></main><script type="module" src="video-compare.js"></script></body></html>
