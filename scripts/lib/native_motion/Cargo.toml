[package]
name = "lr_engine"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The engine uses std collections and Rc. Versions share one cache per lineage;
# detached lineages share it read-only until mutation (see engine.rs).

[profile.release]
opt-level = 3
panic = "abort"
lto = true
strip = true
codegen-units = 1
